<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ef6b2e">
  <meta name="description" content="超级泡泡现场运营岗位状态与员工管理">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./mvp.css">
  <link rel="stylesheet" href="./mvp-actions.css">
  <title>超级泡泡 · 今日现场</title>
</head>
<body>
  <div id="app" class="app">
    <section id="loginView" class="auth-screen" aria-labelledby="loginTitle">
      <div class="auth-brand"><span class="brand-icon">泡</span><span>SUPER BUBBLE</span></div>
      <div class="auth-card">
        <p class="eyebrow">现场运营 · 安全登录</p>
        <h1 id="loginTitle">超级泡泡现场运营</h1>
        <p class="muted">输入自己的员工编号或姓名，再用 PIN 确认身份。</p>
        <form id="loginForm" novalidate>
          <label for="identifier">员工编号或姓名</label>
          <input id="identifier" name="identifier" autocomplete="username" placeholder="例如 FT001 或员工姓名" required maxlength="80">
          <label for="pin">PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="输入个人 PIN" required>
          <p id="loginError" class="form-error" role="alert" hidden></p>
          <button id="loginSubmit" class="primary-button" type="submit">登录今日现场</button>
        </form>
      </div>
      <p id="configHint" class="auth-foot muted"></p>
    </section>

    <section id="changePinView" class="auth-screen" aria-labelledby="changePinTitle" hidden>
      <div class="auth-brand"><span class="brand-icon">泡</span><span>SUPER BUBBLE</span></div>
      <div class="auth-card">
        <p class="eyebrow">首次使用或重置后</p>
        <h1 id="changePinTitle">设置自己的正式 PIN</h1>
        <p class="muted">新 PIN 为 6–8 位数字。设置成功后会签发新的登录会话。</p>
        <form id="changePinForm" novalidate>
          <label for="currentPin">当前临时 PIN</label>
          <input id="currentPin" type="password" inputmode="numeric" autocomplete="current-password" required>
          <label for="newPin">新 PIN</label>
          <input id="newPin" type="password" inputmode="numeric" autocomplete="new-password" minlength="6" maxlength="8" required>
          <label for="confirmPin">再输入一次新 PIN</label>
          <input id="confirmPin" type="password" inputmode="numeric" autocomplete="new-password" minlength="6" maxlength="8" required>
          <p id="changePinError" class="form-error" role="alert" hidden></p>
          <button id="changePinSubmit" class="primary-button" type="submit">保存并进入</button>
        </form>
      </div>
    </section>

    <section id="dashboardView" class="dashboard-screen" hidden>
      <header class="site-header">
        <div class="header-top">
          <div class="header-brand"><span class="brand-icon">泡</span><div><small>SUPER BUBBLE</small><strong>超级泡泡 · 今日现场</strong></div></div>
          <button id="logoutButton" class="header-action" type="button">退出</button>
        </div>
        <div class="header-meta"><span id="phaseBadge" class="phase-badge">正在读取</span><span id="headerPerson"></span></div>
        <div class="header-time"><span id="headerDate"></span><span id="clockNow"></span></div>
      </header>
      <div id="connectionBanner" class="connection-banner" role="status" hidden></div>
      <main id="content" class="content" tabindex="-1"></main>
      <nav id="bottomNav" class="bottom-nav" aria-label="页面导航"></nav>
    </section>
  </div>
  <script src="./config.js"></script>
  <script type="module" src="./mvp.js"></script>
</body>
</html>
